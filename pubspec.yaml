name: mta_app
description: A Flutter mobile application for MTA_APP using Supabase.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.5
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^11.0.3
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_adaptive.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    # NOTE: `.env` is intentionally NOT bundled. Shipping it embeds the
    # Supabase anon key and the Firebase config verbatim in the APK/AAB.
    # Local development still works because `flutter run` passes the values
    # with --dart-define-from-file (see tool/build.dart), and release builds do
    # the same. See lib/config/app_config.dart.
    - assets/mta_logo.png
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
